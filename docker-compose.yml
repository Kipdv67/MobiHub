version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mobihub_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mobihub_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uda_cloud_default

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mobihub_backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=mobihub_db
    depends_on:
      - mysql
    networks:
      - uda_cloud_default

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: mobihub_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - uda_cloud_default

volumes:
  mysql_data:

networks:
  uda_cloud_default:
    driver: bridge